name: Build Qwen3 TTS Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'Qwen3_TTS_ANDROID_ARM64_BUILD_KIT.zip'
      - '.github/workflows/build-qwen.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract build kit
        run: unzip -o Qwen3_TTS_ANDROID_ARM64_BUILD_KIT.zip -d .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Fetch pinned GGML revision
        env:
          GGML_COMMIT: 076861cdfcc5b37ffbbcaa392513786bce9d5b70
        run: |
          git clone https://github.com/ggml-org/ggml.git external/qwen3-tts.cpp/ggml
          git -C external/qwen3-tts.cpp/ggml fetch --depth 1 origin "$GGML_COMMIT"
          git -C external/qwen3-tts.cpp/ggml checkout --detach "$GGML_COMMIT"
          test "$(git -C external/qwen3-tts.cpp/ggml rev-parse HEAD)" = "$GGML_COMMIT"

      - name: Verify required GGML API before compiling
        working-directory: external/qwen3-tts.cpp/ggml
        run: |
          set -eu
          grep -q 'ggml_col2im_1d' include/ggml.h
          grep -q 'GGML_BACKEND_DEVICE_TYPE_IGPU' include/ggml-backend.h
          grep -q 'ggml_diag_mask_inf' include/ggml.h
          grep -q 'ggml_flash_attn_ext_set_prec' include/ggml.h
          echo "All four GGML API declarations are present."

      - name: Pin Android NDK and fix JNI attach signature
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          gradle_text = gradle.read_text()
          if 'ndkVersion = "27.2.12479018"' not in gradle_text:
              anchor = "    compileSdk = 36\n"
              if anchor not in gradle_text:
                  raise SystemExit("Cannot find compileSdk = 36 in app/build.gradle.kts")
              gradle_text = gradle_text.replace(
                  anchor, anchor + '    ndkVersion = "27.2.12479018"\n', 1
              )
              gradle.write_text(gradle_text)

          jni = Path("external/qwen3-tts.cpp/src/qwen3_tts_jni.cpp")
          jni_text = jni.read_text()
          old_type = "void* attached_env = nullptr;"
          new_type = "JNIEnv* attached_env = nullptr;"
          old_cast = "env = static_cast<JNIEnv*>(attached_env);"
          new_cast = "env = attached_env;"

          if old_type not in jni_text or old_cast not in jni_text:
              raise SystemExit(
                  "JNI source differs from the audited source; refusing to patch."
              )
          jni_text = jni_text.replace(old_type, new_type, 1)
          jni_text = jni_text.replace(old_cast, new_cast, 1)
          jni.write_text(jni_text)

          assert new_type in jni_text and new_cast in jni_text
          print("NDK pinned and JNI AttachCurrentThread argument corrected.")
          PYCODE

      - name: Build ARM64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-android-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
