name: Build Qwen3 TTS Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'Qwen3_TTS_ANDROID_ARM64_BUILD_KIT.zip'
      - '.github/workflows/build-qwen.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract build kit
        run: unzip -o Qwen3_TTS_ANDROID_ARM64_BUILD_KIT.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Fetch compatible GGML
        run: |
          mkdir -p external/qwen3-tts.cpp/ggml
          git -C external/qwen3-tts.cpp/ggml init
          git -C external/qwen3-tts.cpp/ggml remote add origin https://github.com/ggml-org/ggml.git
          git -C external/qwen3-tts.cpp/ggml fetch --depth 1 origin 6df7c278a551e27d1e9ed49a73ca2bde45f996e4
          git -C external/qwen3-tts.cpp/ggml checkout FETCH_HEAD

      - name: Build ARM64 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-android-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
